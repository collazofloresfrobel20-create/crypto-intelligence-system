<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Intelligence System — Acceso</title>
<style>
  :root {
    --bg: #fbfbfa; --ink: #171717; --muted: #7a7a78; --border: #e6e4e0;
    --black: #111111;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card { width: 100%; max-width: 360px; padding: 0 28px; }
  h1 {
    font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 600;
    letter-spacing: -0.02em; margin: 0 0 6px;
  }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 40px; line-height: 1.5; }
  label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 600; margin-bottom: 7px; margin-top: 20px;
  }
  input {
    width: 100%; border: none; border-bottom: 1px solid var(--border); background: transparent;
    padding: 8px 2px; font-size: 15px; color: var(--ink); font-family: inherit;
  }
  input:focus { outline: none; border-bottom-color: var(--black); }
  button {
    width: 100%; margin-top: 34px; background: var(--black); color: #fff; border: none;
    padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    letter-spacing: .01em;
  }
  button:hover { background: #2b2b2b; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .error { color: #9a2c2c; font-size: 12.5px; margin-top: 16px; min-height: 16px; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Crypto Intelligence System</h1>
    <p class="sub">Acceso privado. Investigación de oportunidades tempranas en Binance Alpha.</p>

    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Entrar</button>
  </form>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("error");
  btn.disabled = true;
  errorEl.textContent = "";
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      errorEl.textContent = body.detail || "No se pudo iniciar sesión.";
      btn.disabled = false;
      return;
    }
    window.location.href = "/";
  } catch (err) {
    errorEl.textContent = "Error de conexión. Intenta de nuevo.";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
