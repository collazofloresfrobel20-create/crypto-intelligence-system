<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · CIS</title><link rel="stylesheet" href="/login-assets/cis.css"><style>
body.access{min-height:100vh;margin:0;background:#eaf0d9;color:#1e3523}.access-inner{max-width:1080px;min-height:100vh;margin:auto;display:grid;align-content:center;grid-template-columns:minmax(260px,1fr) 1fr;gap:3vw;padding:36px;box-sizing:border-box}
.access .brand{color:#213b28}.access h1{font:600 clamp(3.1rem,7vw,6rem)/.94 Barlow,sans-serif;margin:28px 0 18px}.access p{max-width:38ch}.access label{display:block;font-weight:650;font-size:.9rem;margin:12px 0 4px}.access input,.access button{width:100%;box-sizing:border-box;border-radius:8px;padding:12px 14px;font:inherit}.access input{border:1px solid #a2b398;background:#fff}.access button{border:0;background:#244e32;color:white;font-weight:700;margin-top:14px;cursor:pointer}.access form{max-width:350px}.access-art{max-width:100%;align-self:center}.error{color:#943b29}.access input:focus-visible,.access button:focus-visible{outline:3px solid #66873b}
@media(max-width:650px){.access-inner{grid-template-columns:1fr;padding:24px}.access-art{display:none}}</style></head>
<body class="access"><main class="access-inner"><section><span class="brand"><img width="38" src="/login-assets/token-small.png" alt="">CIS.</span><h1>Crypto Intelligence System<span>.</span></h1><p>Accede a tus candidatos, expedientes y resultados de investigación.</p><form class="card" id="loginForm">



    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Entrar</button>
  </form></section><img class="access-art" src="/login-assets/token.png" alt=""></main><script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("error");
  btn.disabled = true;
  errorEl.textContent = "";
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      errorEl.textContent = body.detail || "No se pudo iniciar sesión.";
      btn.disabled = false;
      return;
    }
    window.location.href = "/v2/";
  } catch (err) {
    errorEl.textContent = "Error de conexión. Intenta de nuevo.";
    btn.disabled = false;
  }
});
</script></body></html>
