# Plantilla de configuración para Cloudflare Tunnel (cloudflared).
# Expone el backend de CIS (que sigue corriendo localmente o en tu servidor) bajo un
# dominio de Cloudflare, sin abrir puertos entrantes y con TLS automático.
#
# Uso:
#   1. cloudflared tunnel login
#   2. cloudflared tunnel create cis
#   3. Copia este archivo a ~/.cloudflared/config.yml (o pasa --config al correr cloudflared)
#      y reemplaza <TUNNEL_ID> y tu-dominio.com por los tuyos.
#   4. cloudflared tunnel route dns cis cis.tu-dominio.com
#   5. cloudflared tunnel run cis
#
# El backend (uvicorn) debe estar corriendo en el puerto indicado en `service` abajo.

tunnel: <TUNNEL_ID>
credentials-file: ~/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: cis.tu-dominio.com
    service: http://localhost:8000
  - service: http_status:404
